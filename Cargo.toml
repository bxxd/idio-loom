[package]
name = "idio-loom"
version = "0.2.0"
edition = "2021"
description = "Multi-agent thread orchestrator for Claude Code"
license = "MIT"
repository = "https://github.com/bxxd/idio-loom"
authors = ["breed <breed@idio.sh>"]
keywords = ["agents", "claude", "orchestrator", "multi-agent", "llm"]
readme = "README.md"

[lib]
name = "idio_loom"
path = "src/lib.rs"

[[bin]]
name = "loom"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dirs = "5"

[dev-dependencies]
tempfile = "3"
