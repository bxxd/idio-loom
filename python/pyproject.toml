[project]
name = "idio-loom"
version = "0.2.0"
description = "Python wrapper for the loom multi-agent turn engine"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "breed", email = "breed@idio.sh"}]

[project.urls]
Repository = "https://github.com/bxxd/idio-loom"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["idio_loom*"]
